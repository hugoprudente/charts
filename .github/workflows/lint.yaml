name: Lint and Test Charts

on:
  pull_request:
    branches:
      - main
      - 'foundryvtt/*.x'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.16.2"

      - uses: actions/setup-python@v6
        with:
          # ct/yamale (Chart.yaml schema) breaks on Python 3.14+ (ast.Num removed).
          python-version: "3.12"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        env:
          FOLDERS: incubator
          BRANCH: ${{ github.base_ref }}
        run: |
          changed=$(ct list-changed --chart-dirs "$FOLDERS" --target-branch "$BRANCH")
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Charts changed:"
            echo "$changed"
          else
            echo "No chart changes detected against $BRANCH"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        env:
          FOLDERS: incubator
          BRANCH: ${{ github.base_ref }}
        run: ct lint --chart-dirs "$FOLDERS" --target-branch "$BRANCH"

      - name: Helm template smoke tests (foundry-vtt)
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          cd incubator
          helm lint foundry-vtt --strict
          cd foundry-vtt
          helm lint .
          helm lint . --strict
          helm template smoke . >/dev/null
          helm template smoke . --set persistence.dataDir.enabled=true >/dev/null
          helm template smoke . --set ingress.enabled=true >/dev/null
          helm template smoke . --set ingress.enabled=true \
            --set 'ingress.configurationSnippet=more_set_headers test 1;' >/dev/null
